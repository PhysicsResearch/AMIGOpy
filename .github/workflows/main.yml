name: Build AMIGOpy and Release (Official Signed)

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Release version, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      KMP_DUPLICATE_LIB_OK: "TRUE"
      PYSIDE_DISABLE_INTERNAL_QT_CONF: "1"
      QT_PLUGIN_PATH: ""
      QT_QPA_PLATFORM_PLUGIN_PATH: ""
      NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Nuitka cache
        uses: actions/cache@v4
        with:
          path: .nuitka-cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/*.py', '.github/workflows/main.yml') }}
          restore-keys: ${{ runner.os }}-nuitka-

      - name: Build with Nuitka
        shell: powershell
        env:
          PYSIDE_DISABLE_INTERNAL_QT_CONF: "1"
          QT_PLUGIN_PATH: ""
          QT_QPA_PLATFORM_PLUGIN_PATH: ""
          MPLBACKEND: "Agg"
        run: |
          python -m venv venv-build
          $venvScripts = "$(Resolve-Path .\venv-build\Scripts)"

          $oldPath = $env:Path
          $env:Path = "$venvScripts;$env:SystemRoot\system32;$env:SystemRoot"

          python -m pip install --upgrade pip wheel setuptools

          pip install `
            "PySide6==6.7.3" `
            "PySide6-Addons==6.7.3" `
            "PySide6-Essentials==6.7.3" `
            "shiboken6==6.7.3"

          pip install "numpy==1.26.*" "scipy==1.12.*"
          pip install pillow pydicom
          pip install "scikit-image==0.22.*" "nibabel==5.*" "SimpleITK==2.5.*"
          pip install "opencv-python-headless==4.10.*"

          pip install "qdarkstyle>=3.1" "qstylizer>=0.2.2"
          pip install "vtk==9.3.1"
          pip install "matplotlib==3.8.*"

          pip install "requests>=2.31" certifi
          pip install "joblib>=1.3,<2"
          pip install "openpyxl>=3.1"

          pip install "pandas==2.2.*"
          pip install "numexpr>=2.10,<3"
          pip install "zstandard>=0.22"

          pip install "nuitka>=2.2" ordered-set zstandard

          python -c "import PySide6.QtCore as QC; from PySide6 import QtWebEngineCore as QW; print('PySide6:', QC.__file__); print('QtWebEngineCore:', QW.__file__)"

          $vtkSrc = python -c "import os, vtkmodules; print(os.path.dirname(vtkmodules.__file__))"
          $vtkSrc = ($vtkSrc.Trim() -replace '\\','/')
          $vtkDataArg = "--include-data-dir=$vtkSrc=vtkmodules"

          $qtBase = python -c "import os, PySide6; print(os.path.join(os.path.dirname(PySide6.__file__),'Qt'))"
          $qtBase = ($qtBase.Trim() -replace '\\','/')
          $qtRes  = "$qtBase/resources"
          $qtTr   = "$qtBase/translations"
          $qtExec = "$qtBase/libexec"

          $qtArgs = @()
          if (Test-Path $qtRes)  { $qtArgs += "--include-data-dir=$qtRes=PySide6/Qt/resources" }
          if (Test-Path $qtTr)   { $qtArgs += "--include-data-dir=$qtTr=PySide6/Qt/translations" }
          if (Test-Path $qtExec) { $qtArgs += "--include-data-dir=$qtExec=PySide6/Qt/libexec" }

          $args = @(
            "Launch_ImGUI.py",
            "--standalone",
            "--remove-output",
            "--output-dir=dist\AMIGOpy",
            "--enable-plugin=pyside6",
            "--include-qt-plugins=platforms,imageformats,styles",
            "--windows-console-mode=force",
            "---report=dist\AMIGOpy\build_report.html".Replace("---","--"),
            "--assume-yes-for-downloads",

            "--include-package=pydicom",
            "--include-package-data=pydicom",
            "--include-package=PIL",
            "--include-package=numpy",
            "--include-package=scipy",
            "--include-package=skimage",
            "--include-package-data=skimage",
            "--include-package=nibabel",
            "--include-package=SimpleITK",
            "--include-package=cv2",
            "--include-package=vtkmodules",
            "--include-package=vtkmodules.qt",
            "--include-package=qdarkstyle",
            "--include-package-data=qdarkstyle",
            "--include-package=qstylizer",
            "--include-package=matplotlib",
            "--include-package-data=matplotlib",
            "--include-package=requests",
            "--include-package-data=certifi",
            "--include-package=joblib",
            "--include-package=openpyxl",
            "--include-package-data=openpyxl",
            "--include-package=pandas",
            "--include-package-data=pandas",
            "--include-package=numexpr",
            "--include-package-data=zstandard",
            "--include-distribution-metadata=zstandard",

            "--nofollow-import-to=totalsegmentator",
            "--nofollow-import-to=torch",
            "--nofollow-import-to=torchvision",
            "--nofollow-import-to=monai",
            "--nofollow-import-to=nnunet",
            "--nofollow-import-to=nnunetv2",
            "--nofollow-import-to=einops",
            "--nofollow-import-to=tqdm",
            "--nofollow-import-to=fastapi",
            "--nofollow-import-to=starlette",
            "--nofollow-import-to=uvicorn",
            "--nofollow-import-to=pydantic",

            "--include-data-files=icons\ruler.png=icons\ruler.png",
            "--include-data-files=icons\dcm_insp.png=icons\dcm_insp.png",
            "--include-data-files=icons\brush.png=icons\brush.png",
            "--include-data-files=icons\eraser.png=icons\eraser.png",
            "--include-data-files=icons\layout.png=icons\layout.png",
            "--include-data-files=icons\roi_point.png=icons\roi_point.png",
            "--include-data-files=icons\roi_circle.png=icons\roi_circle.png",
            "--include-data-files=icons\roi_ellipse.png=icons\roi_ellipse.png",
            "--include-data-files=icons\roi_square.png=icons\roi_square.png",
            "--include-data-files=icons\undo.png=icons\undo.png",

            "--include-data-dir=fcn_ctcal\ct_cal_curves=fcn_ctcal\ct_cal_curves",
            "--include-data-files=fcn_materialassignment\materials_db.csv=fcn_materialassignment\materials_db.csv"
          )

          $args += $vtkDataArg
          $args += $qtArgs

          $oldQtConf = $env:PYSIDE_DISABLE_INTERNAL_QT_CONF
          $env:PYSIDE_DISABLE_INTERNAL_QT_CONF = ""

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          python -m nuitka @args

          $env:PYSIDE_DISABLE_INTERNAL_QT_CONF = $oldQtConf
          $env:Path = $oldPath

      - name: Flatten Nuitka dist into dist\AMIGOpy
        shell: powershell
        run: |
          $root = "dist\AMIGOpy"
          $src  = Join-Path $root "Launch_ImGUI.dist"

          if (!(Test-Path $src)) {
            throw "Expected $src not found"
          }

          Copy-Item -Path "$src\*" -Destination $root -Recurse -Force
          Remove-Item -Path $src -Recurse -Force

      - name: Verify dist contents
        shell: powershell
        run: |
          if (-not (Test-Path "dist\AMIGOpy\Launch_ImGUI.exe")) {
            throw "Launch_ImGUI.exe missing"
          }

      - name: Ensure Inno Setup is installed
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "${Env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if (!(Test-Path $iscc)) {
              $isccAlt = "${Env:ProgramFiles}\Inno Setup 6\ISCC.exe"
              if (Test-Path $isccAlt) {
                $iscc = $isccAlt
              } else {
                throw "ISCC.exe not found after install."
              }
            }
          }
          $global:LASTEXITCODE = 0

      - name: Build AMIGOpy installer
        shell: powershell
        run: |
          $iscc = "${Env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "${Env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc AMIGOpy.iss

      # === Stage Bundle for SignPath ===
      # Staging folder "unsigned/" is created. We copy the compiled installer exe as "mysetup.exe".
      # Since the SignPath XML configuration requires segmentator_api.exe to be present, we copy
      # the installer also as "segmentator_api.exe" to satisfy the PE file set list.
      - name: Stage unsigned bundle
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "unsigned" -Force | Out-Null
          if (!(Test-Path "Output\AMIGOpy-Setup.exe")) { throw "AMIGOpy installer not found at Output\AMIGOpy-Setup.exe" }
          Copy-Item "Output\AMIGOpy-Setup.exe" "unsigned\mysetup.exe"
          Copy-Item "Output\AMIGOpy-Setup.exe" "unsigned\segmentator_api.exe"

      - name: Upload unsigned bundle artifact
        id: upload_unsigned_bundle
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-bundle
          path: unsigned/
          if-no-files-found: error
          overwrite: true

      # === Submit to SignPath ===
      - name: Submit bundle to SignPath
        uses: signpath/github-action-submit-signing-request@v1.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG_RELEASE }}
          github-artifact-id: ${{ steps.upload_unsigned_bundle.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # === Extract Signed Zip and Rename/Upload Signed Installer ===
      - name: List signed folder contents
        shell: powershell
        run: |
          if (Test-Path "signed") {
            Write-Host "Contents of 'signed' folder:"
            Get-ChildItem -Path "signed" -Recurse | Format-List -Property FullName, Length
          } else {
            Write-Host "'signed' folder does not exist."
          }

      - name: Extract signed files
        shell: powershell
        run: |
          if (Test-Path -LiteralPath "signed_extracted") { Remove-Item -Recurse -Force "signed_extracted" }
          New-Item -ItemType Directory -Path "signed_extracted" | Out-Null
          
          $zip = Get-ChildItem -Path "signed" -Filter *.zip | Select-Object -First 1
          if ($zip) {
              Write-Host "Found signed zip: $($zip.FullName). Extracting..."
              Expand-Archive -Path $zip.FullName -DestinationPath "signed_extracted" -Force
          } else {
              Write-Host "No signed zip found. Locating raw executables..."
              $exe = Get-ChildItem -Path "signed" -Filter "mysetup.exe" -Recurse | Select-Object -First 1
              if ($exe) {
                  Write-Host "Found raw mysetup.exe at: $($exe.FullName). Copying..."
                  Copy-Item $exe.FullName "signed_extracted\mysetup.exe"
              } else {
                  throw "Could not find 'mysetup.exe' anywhere in the 'signed' folder."
              }
          }
          Get-ChildItem -Path "signed_extracted" -Recurse

      - name: Prepare installer for release
        shell: powershell
        run: |
          Rename-Item -Path "signed_extracted\mysetup.exe" -NewName "AMIGOpy_Setup.exe"
          if (!(Test-Path "signed_extracted\AMIGOpy_Setup.exe")) { throw "AMIGOpy_Setup.exe not found in signed_extracted" }

      - name: Upload signed AMIGOpy installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMIGOpy_Setup_signed-v${{ github.event.inputs.app_version }}
          path: signed_extracted/AMIGOpy_Setup.exe
          if-no-files-found: error
          overwrite: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.app_version }}
          name: AMIGOpy v${{ github.event.inputs.app_version }}
          draft: false
          prerelease: false
          files: |
            signed_extracted/AMIGOpy_Setup.exe
