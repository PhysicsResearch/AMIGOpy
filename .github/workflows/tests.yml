name: Tests

on:
  push:
    branches: [ Development, main ]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6==6.7.3" "numpy==1.26.*" "scipy==1.12.*" "matplotlib==3.8.*" "pandas==2.2.*" "plotly==5.24.*" pydicom pytest

      - name: Run unit tests (offscreen Qt)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
          MPLBACKEND: Agg
        run: python -m pytest tests -q -p no:cacheprovider
